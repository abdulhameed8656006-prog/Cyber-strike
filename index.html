<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07111f"><meta name="description" content="Cyber Strike online arcade shooter"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Cyber Strike</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:#eaf4ff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block;background:radial-gradient(circle at 50% 35%,#10213d,#070d1b 48%,#03060d)}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px 0;font-weight:800}.pill{background:#0b1628cc;border:1px solid #28466b;border-radius:12px;padding:8px 11px}.accent{color:#67d8ff}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#020611aa;backdrop-filter:blur(6px);z-index:5}.card{width:min(92vw,430px);padding:28px;border:1px solid #2c4d73;border-radius:22px;background:#091326ee;text-align:center;box-shadow:0 20px 80px #0008}.logo{font-size:clamp(38px,11vw,64px);font-weight:950;color:#7ce7ff;text-shadow:0 0 25px #00aaff88}.sub{color:#9db4cd;margin:5px 0 20px}.field,.btn{width:100%;padding:13px 15px;border-radius:12px;font-size:16px}.field{border:1px solid #345678;background:#07101e;color:white;margin:6px 0 10px}.btn{border:0;margin-top:8px;background:#1aa8e8;color:#00111b;font-weight:900}.btn.alt{background:#14253b;color:#bfe8ff;border:1px solid #2c4d73}.status{min-height:22px;color:#8ea8c3;font-size:13px;margin-top:12px}#controls{position:fixed;inset:auto 0 0;display:flex;justify-content:space-between;align-items:end;padding:0 18px max(18px,env(safe-area-inset-bottom));pointer-events:none}.stick,.fire{pointer-events:auto;opacity:.8}.stick{width:128px;height:128px;border-radius:50%;background:#10233dcc;border:2px solid #3d6288;position:relative}.knob{width:52px;height:52px;border-radius:50%;background:#55d7ff;position:absolute;left:38px;top:38px}.fire{width:100px;height:100px;border-radius:50%;border:2px solid #63dcff;background:#143b57cc;color:#bff3ff;font-weight:950}.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;color:#7892ad;font-size:11px;pointer-events:none}@media(min-width:800px){#controls{display:none}}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="pill">CYBER STRIKE</div><div class="pill">Score <span id="score" class="accent">0</span> · Players <span id="players" class="accent">1</span></div></div></div><div id="menu"><div class="card"><div class="logo">CYBER STRIKE</div><div class="sub">Online arcade shooter</div><input id="name" class="field" maxlength="16" value="Player" placeholder="Player name"><button id="host" class="btn">CREATE ONLINE ROOM</button><button id="join" class="btn alt">JOIN ROOM</button><input id="room" class="field" maxlength="12" placeholder="Room code" style="display:none"><div id="status" class="status">Create a room to start.</div></div></div><div id="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="fire" id="fire">FIRE</button></div><div class="hint">Desktop: WASD / arrows · mouse aim · click fire</div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr=Math.min(devicePixelRatio||1,2),running=false,peer,conn,score=0,last=0,lastShot=0,keys={},joy={x:0,y:0},mouse={x:0,y:0},shots=[],enemies=[],particles=[],remote={};const me={x:0,y:0,r:16,speed:260,name:'Player'};function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function rnd(a,b){return Math.random()*(b-a)+a}function spawn(){let s=Math.floor(Math.random()*4),e={x:s<2?rnd(0,W):s===2?-25:W+25,y:s<2?(s?H+25:-25):rnd(0,H),r:13,speed:rnd(45,85)};enemies.push(e)}function fire(){let n=performance.now();if(n-lastShot<180)return;lastShot=n;let a=Math.atan2(mouse.y-me.y,mouse.x-me.x);shots.push({x:me.x,y:me.y,vx:Math.cos(a)*650,vy:Math.sin(a)*650,life:1})}function burst(a,b){for(let i=0;i<7;i++)particles.push({x:a,y:b,vx:rnd(-100,100),vy:rnd(-100,100),life:.35})}function update(dt){let dx=(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0),dy=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);dx+=joy.x;dy+=joy.y;let l=Math.hypot(dx,dy)||1;me.x=Math.max(20,Math.min(W-20,me.x+dx/l*me.speed*dt));me.y=Math.max(20,Math.min(H-20,me.y+dy/l*me.speed*dt));shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt});shots=shots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);enemies.forEach(e=>{let a=Math.atan2(me.y-e.y,me.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt});for(let si=shots.length-1;si>=0;si--)for(let ei=enemies.length-1;ei>=0;ei--)if(Math.hypot(shots[si].x-enemies[ei].x,shots[si].y-enemies[ei].y)<20){burst(enemies[ei].x,enemies[ei].y);enemies.splice(ei,1);shots.splice(si,1);score++;document.getElementById('score').textContent=score;break}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);while(enemies.length<Math.min(8,3+Math.floor(score/5)))spawn();if(conn?.open)try{conn.send({t:'state',x:me.x/W,y:me.y/H,name:me.name})}catch{}}
function draw(){x.clearRect(0,0,W,H);x.strokeStyle='#112742';for(let i=0;i<W;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=50){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}enemies.forEach(e=>{x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fillStyle='#7d5cff';x.fill();x.strokeStyle='#b7a8ff';x.stroke()});Object.values(remote).forEach(p=>{x.beginPath();x.arc(p.x*W,p.y*H,16,0,7);x.fillStyle='#ffb84d';x.fill();x.fillStyle='#fff';x.font='11px system-ui';x.textAlign='center';x.fillText(p.name||'Player',p.x*W,p.y*H-23)});shots.forEach(s=>{x.beginPath();x.arc(s.x,s.y,4,0,7);x.fillStyle='#7ce7ff';x.fill()});x.beginPath();x.arc(me.x,me.y,16,0,7);x.fillStyle='#55d7ff';x.fill();x.strokeStyle='#d8f8ff';x.stroke();x.fillStyle='#fff';x.font='11px system-ui';x.textAlign='center';x.fillText(me.name,me.x,me.y-23);particles.forEach(p=>{x.globalAlpha=Math.max(0,p.life/.35);x.fillStyle='#7ce7ff';x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}function start(){me.name=(document.getElementById('name').value.trim()||'Player').slice(0,16);me.x=W/2;me.y=H/2;running=true;document.getElementById('menu').style.display='none';for(let i=0;i<3;i++)spawn();requestAnimationFrame(loop)}function wire(cn){conn=cn;cn.on('open',()=>{document.getElementById('status').textContent='Connected';if(!running)start()});cn.on('data',m=>{if(m.t==='state'){remote.p={x:m.x,y:m.y,name:m.name};document.getElementById('players').textContent=2}});cn.on('close',()=>{delete remote.p;document.getElementById('players').textContent=1})}document.getElementById('host').onclick=()=>{let id=Math.random().toString(36).slice(2,8).toUpperCase();document.getElementById('room').style.display='block';document.getElementById('room').value=id;document.getElementById('status').textContent='Room '+id+' created';peer=new Peer('CS-'+id);peer.on('open',start);peer.on('connection',wire);peer.on('error',e=>document.getElementById('status').textContent='Network error: '+e.type)};document.getElementById('join').onclick=()=>{let id=document.getElementById('room').value.trim().toUpperCase();document.getElementById('room').style.display='block';if(!id){document.getElementById('status').textContent='Enter a room code';return}peer=new Peer();peer.on('open',()=>wire(peer.connect('CS-'+id)));peer.on('error',e=>document.getElementById('status').textContent='Could not join: '+e.type)};addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',e=>{if(running&&e.target===c)fire()});function jm(e){let r=document.getElementById('stick').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.min(48,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*l/48;joy.y=Math.sin(a)*l/48;document.getElementById('knob').style.transform='translate('+joy.x*48+'px,'+joy.y*48+'px)'}function je(){joy.x=joy.y=0;document.getElementById('knob').style.transform='translate(0,0)'}let st=document.getElementById('stick');st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);jm(e)});st.addEventListener('pointermove',e=>{if(e.buttons)jm(e)});st.addEventListener('pointerup',je);st.addEventListener('pointercancel',je);document.getElementById('fire').addEventListener('pointerdown',()=>{mouse.x=me.x+1;mouse.y=me.y-1;fire()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
