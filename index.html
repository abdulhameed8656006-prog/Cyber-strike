<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06101c"><meta name="description" content="Cyber Strike third-person horizontal arcade shooter">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Cyber Strike</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030710;color:#eaf7ff;font-family:system-ui,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px 16px;font-weight:900}.pill{background:#071526dd;border:1px solid #285174;border-radius:12px;padding:8px 12px}.accent{color:#69dcff}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:#020611cc;backdrop-filter:blur(7px);z-index:5}.card{width:min(90vw,430px);padding:28px;border:1px solid #315779;border-radius:22px;background:#081426f2;text-align:center}.logo{font-size:clamp(38px,8vw,62px);font-weight:950;color:#73e5ff;text-shadow:0 0 28px #00baff66}.sub{color:#9bb4ca;margin:4px 0 18px}.field,.btn{width:100%;padding:13px;border-radius:12px;font-size:16px}.field{background:#06101d;color:white;border:1px solid #315779;margin:5px 0 10px}.btn{border:0;background:#16a9e8;color:#00111b;font-weight:950;margin-top:8px}.alt{background:#13263d;color:#bfeeff;border:1px solid #315779}.status{min-height:20px;color:#8ea8bf;font-size:13px;margin-top:12px}
#controls{position:fixed;inset:auto 0 0;display:flex;justify-content:space-between;align-items:end;padding:0 20px max(16px,env(safe-area-inset-bottom));pointer-events:none}.stick,.fire{pointer-events:auto}.stick{width:118px;height:118px;border-radius:50%;background:#0c2135cc;border:2px solid #416887;position:relative}.knob{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#5bdcff}.fire{width:94px;height:94px;border-radius:50%;background:#123b58dd;color:#c8f5ff;border:2px solid #6ae4ff;font-weight:950}.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:7px;color:#7894ad;font-size:11px}
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#02050c;color:white;place-items:center;text-align:center;font-weight:900;font-size:20px;padding:30px}
@media(orientation:portrait){#rotate{display:grid}}
@media(min-width:800px){#controls{display:none}}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="top"><div class="pill">CYBER STRIKE</div><div class="pill">Score <span id="score" class="accent">0</span> · Players <span id="players" class="accent">1</span></div></div></div>
<div id="menu"><div class="card"><div class="logo">CYBER STRIKE</div><div class="sub">Third-person online arcade shooter</div><input id="name" class="field" maxlength="16" value="Player" placeholder="Player name"><button id="host" class="btn">CREATE ONLINE ROOM</button><button id="join" class="btn alt">JOIN ROOM</button><input id="room" class="field" maxlength="12" placeholder="Room code" style="display:none"><div id="status" class="status">Landscape mode recommended.</div></div></div>
<div id="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="fire" id="fire">FIRE</button></div><div class="hint">Landscape · WASD / arrows · mouse aim · click fire</div><div id="rotate">↻<br>Rotate your device horizontally</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr=1,running=false,peer,conn,score=0,last=0,lastShot=0,keys={},joy={x:0,y:0},mouse={x:0,y:0},shots=[],bots=[],remote={},spawnTimer=0;
const me={x:0,y:0,angle:0,speed:250,name:'Player'};
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function rnd(a,b){return Math.random()*(b-a)+a}
function spawn(){let side=Math.floor(Math.random()*4);bots.push({x:side<2?(side?W+40:-40):rnd(0,W),y:side<2?rnd(70,H-50):(side===2?-40:H+40),r:16,s:rnd(45,75)})}
function fire(){let n=performance.now();if(n-lastShot<180||!running)return;lastShot=n;let a=Math.atan2(mouse.y-me.y,mouse.x-me.x);shots.push({x:me.x+Math.cos(a)*24,y:me.y+Math.sin(a)*24,vx:Math.cos(a)*700,vy:Math.sin(a)*700,life:1})}
function update(dt){let dx=(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0),dy=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);dx+=joy.x;dy+=joy.y;let l=Math.hypot(dx,dy)||1;me.x=Math.max(45,Math.min(W-45,me.x+dx/l*me.speed*dt));me.y=Math.max(80,Math.min(H-45,me.y+dy/l*me.speed*dt));me.angle=Math.atan2(mouse.y-me.y,mouse.x-me.x);
shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt});shots=shots.filter(s=>s.life>0&&s.x>-50&&s.x<W+50&&s.y>-50&&s.y<H+50);
bots.forEach(b=>{let a=Math.atan2(me.y-b.y,me.x-b.x);b.x+=Math.cos(a)*b.s*dt;b.y+=Math.sin(a)*b.s*dt});
for(let i=shots.length-1;i>=0;i--)for(let j=bots.length-1;j>=0;j--)if(Math.hypot(shots[i].x-bots[j].x,shots[i].y-bots[j].y)<22){bots.splice(j,1);shots.splice(i,1);score++;document.getElementById('score').textContent=score;break}
spawnTimer-=dt;if(spawnTimer<=0&&bots.length<Math.min(10,3+Math.floor(score/4))){spawn();spawnTimer=Math.max(.35,1-score*.01)}
if(conn?.open)try{conn.send({t:'state',x:me.x/W,y:me.y/H,a:me.angle,name:me.name})}catch{}
}
function drawPlayer(p,remotePlayer=false){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle||0);
ctx.fillStyle=remotePlayer?'#ffb84d':'#48d8ff';ctx.beginPath();ctx.ellipse(0,5,17,22,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#172c43';ctx.beginPath();ctx.arc(0,-13,11,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#9ef0ff';ctx.fillRect(7,-4,25,6);ctx.fillStyle='#07111e';ctx.fillRect(-7,-16,14,4);ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);let horizon=H*.28;
ctx.fillStyle='#071321';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0b2030';ctx.fillRect(0,horizon,W,H-horizon);
ctx.strokeStyle='#12384d';ctx.lineWidth=1;for(let i=0;i<18;i++){let y=horizon+Math.pow(i/18,1.7)*(H-horizon);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=-12;i<=12;i++){ctx.beginPath();ctx.moveTo(W/2+i*55,horizon);ctx.lineTo(W/2+i*120,H);ctx.stroke()}
ctx.fillStyle='#17334a';for(let i=0;i<16;i++){let bx=i*90+(i%3)*18;ctx.fillRect(bx,horizon-rnd(15,60),55,rnd(15,60))}
bots.forEach(b=>{ctx.fillStyle='#684fbd';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b9aaff';ctx.stroke()});
Object.values(remote).forEach(p=>drawPlayer({x:p.x*W,y:p.y*H,angle:p.a},true));shots.forEach(s=>{ctx.fillStyle='#78eaff';ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill()});drawPlayer(me,false);
ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(me.name,me.x,me.y-34);
}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
async function start(){me.name=(document.getElementById('name').value.trim()||'Player').slice(0,16);me.x=W/2;me.y=H*.62;running=true;document.getElementById('menu').style.display='none';for(let i=0;i<4;i++)spawn();if(screen.orientation?.lock)try{await screen.orientation.lock('landscape')}catch{}requestAnimationFrame(loop)}
function wire(cn){conn=cn;cn.on('open',()=>{document.getElementById('status').textContent='Connected';if(!running)start()});cn.on('data',m=>{if(m.t==='state'){remote.p=m;document.getElementById('players').textContent='2'}});cn.on('close',()=>{delete remote.p;document.getElementById('players').textContent='1'})}
host.onclick=()=>{let id=Math.random().toString(36).slice(2,8).toUpperCase();room.style.display='block';room.value=id;status.textContent='Room '+id+' created';peer=new Peer('CS-'+id);peer.on('open',start);peer.on('connection',wire);peer.on('error',e=>status.textContent='Network error: '+e.type)};
join.onclick=()=>{let id=room.value.trim().toUpperCase();room.style.display='block';if(!id){status.textContent='Enter a room code';return}peer=new Peer();peer.on('open',()=>wire(peer.connect('CS-'+id)));peer.on('error',e=>status.textContent='Could not join: '+e.type)};
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',e=>{if(e.target===c)fire()});
function jm(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.min(46,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy.x=Math.cos(a)*l/46;joy.y=Math.sin(a)*l/46;knob.style.transform='translate('+joy.x*46+'px,'+joy.y*46+'px)'}function je(){joy.x=joy.y=0;knob.style.transform='translate(0,0)'}
stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);jm(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)jm(e)});stick.addEventListener('pointerup',je);stick.addEventListener('pointercancel',je);fire.addEventListener('pointerdown',()=>{mouse.x=me.x+100;mouse.y=me.y;fire()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
